<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Body Map</title><style>
*{box-sizing:border-box}
html,body{height:100%;height:100dvh}
body{margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;color:#1D2122}

/* 顶部标题区 */
.app-header{padding:max(20px, calc(env(safe-area-inset-top) + 8px)) 26px 2px}
.app-header h1{font-size:34px;font-weight:700;margin:0;letter-spacing:-0.01em}
.app-header p.sub{margin:7px 0 0;font-size:14.5px;color:#6E7778;line-height:1.65}

/* 肌肉图容器：撑满中间 */
.stage{position:relative;margin:0 16px;flex:1;min-height:0;border-radius:28px;overflow:hidden;background:#F2F8F7;box-shadow:0 10px 30px -12px rgba(31,68,77,.12);}
.stage .badge{position:absolute;left:12px;top:12px;z-index:10;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;color:#337F92;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(31,68,77,.08);pointer-events:none}
.stage .seg{position:absolute;right:12px;top:12px;z-index:10;display:flex;gap:4px;padding:3px;border-radius:99px;background:#E9EFEE;}
.stage .seg button{font:inherit;border:0;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:#A2ABAC;transition:color .12s}
.stage .seg button.on{background:#fff;color:#337F92;box-shadow:0 2px 8px rgba(31,68,77,.08)}

.stage svg{display:block;}

/* 气泡：点按后显示 */
.tap-bubble{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:10;padding:6px 14px;border-radius:99px;font-size:12.5px;font-weight:500;color:#fff;background:rgba(29,33,34,.82);backdrop-filter:blur(4px);pointer-events:none;opacity:0;transition:opacity .16s}
.tap-bubble.show{opacity:1}

/* 底部输入栏 */
.bottom-bar{padding:10px 16px max(12px, calc(env(safe-area-inset-bottom) + 8px));background:#fff;box-shadow:0 -8px 30px -18px rgba(31,68,77,.25)}
.bottom-bar .row{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 16px;border-radius:99px;background:#F1F4F4}
.bottom-bar input{flex:1;border:0;background:transparent;font:inherit;font-size:15px;color:#1D2122;outline:none}
.bottom-bar input::placeholder{color:#A2ABAC}
.bottom-bar .go{flex-shrink:0;width:36px;height:36px;border-radius:50%;border:0;background:#4198AC;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(65,152,172,.4);transition:transform .12s,background .12s}
.bottom-bar .go:active{transform:scale(.95);background:#337F92}
.bottom-bar .go:disabled{background:#DDE4E3;color:#AFB9B8;cursor:default;box-shadow:none}

/* 网格虚线不拦截点击，让点击穿透到肌肉 */
.stage svg line{pointer-events:none}

/* 原来的颜色保留 */
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin:0 4px 0 12px}
.m{fill:#F6F0E9;stroke:#E3D5C8;stroke-width:.46;cursor:pointer;transition:fill .12s}
.m:hover{fill:#EADFD2}
.m.tight{fill:#E0703F;stroke:#BF5228;stroke-width:.55}
.m.weak{fill:#5578A8;stroke:#3D5E88;stroke-width:.55}
.m.sel{fill:#4198AC;stroke:#337F92;stroke-width:.55}
/* 结果页：过劳=橘 / 过弱=淡紫 */
#page-result .m.tight{fill:#F0A35E;stroke:#D97B2B;stroke-width:.55}
#page-result .m.weak{fill:#C9B6E8;stroke:#9B7CB8;stroke-width:.55}
#page-result .m.tight.inferred,#page-result .m.weak.inferred{stroke-dasharray:2.6 1.6;stroke-width:.85}

/* ── 缩放 ─────────────────────────── */
.stage .zoomer{position:absolute;right:12px;bottom:12px;z-index:10;display:flex;flex-direction:column;gap:6px;align-items:center}
.stage .zoomer button{width:36px;height:36px;border-radius:50%;border:0;font-size:18px;font-weight:700;color:#337F92;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(31,68,77,.12);cursor:pointer;display:flex;align-items:center;justify-content:center}
.stage .zoomer button:active{background:#E8F3F4}
.stage .zoomer .z-reset{font-size:12px;width:auto;height:26px;padding:0 10px;border-radius:13px;font-weight:600;opacity:.75}
.stage .zoomer .z-reset.show{opacity:1}

.stage .zoom-scroller{overflow:auto;overscroll-behavior:contain;width:100%;height:100%;touch-action:none}
.stage .zoom-scroller::-webkit-scrollbar{display:none}
.stage .zoom-scroller{scrollbar-width:none}
.stage .zoom-wrap{display:flex;align-items:center;justify-content:center}
.stage .zoom-wrap svg{display:block;width:100%;height:100%}
.stage .zoom-wrap svg path{pointer-events:visiblePainted}
.stage .zoom-wrap svg line{pointer-events:none}

/* 正/背面卡片：铺满 stage，同一时间只显示一面 */
.stage .card{position:absolute;inset:0;}
/* ── 诊断结果页 ─────────────────────── */
.page{position:absolute;inset:0;display:flex;flex-direction:column}
#stage-result{flex:1;min-height:0;margin:0 16px;border-radius:28px;overflow:hidden;background:#F2F8F7;box-shadow:0 10px 30px -12px rgba(31,68,77,.12)}
#stage-result .seg{position:absolute;right:12px;top:12px;z-index:10;display:flex;gap:4px;padding:3px;border-radius:99px;background:#E9EFEE}
#stage-result .seg button{font:inherit;border:0;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:#A2ABAC;transition:color .12s}
#stage-result .seg button.on{background:#fff;color:#337F92;box-shadow:0 2px 8px rgba(31,68,77,.08)}

.result-header{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;background:#fff;border-bottom:1px solid #edf0ef;flex-shrink:0}
.back-btn{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:#1D2122;cursor:pointer;display:flex;align-items:center;justify-content:center}
.back-btn:active{background:#F2F8F7}
.result-title{flex:1;text-align:center;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:6px 0;font-size:15px;font-weight:600;color:#1D2122}
.rt-chevron{font-size:10px;color:#A2ABAC;transition:transform .2s}
.result-title.open .rt-chevron{transform:rotate(180deg)}
.result-legend{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:500;color:#6E7778}
.lg-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}
.lg-tight{background:#E0703F}
.lg-weak{background:#9B7CB8}
.lg-inferred{background:#fff;border:1.5px dashed #A2ABAC;box-sizing:border-box}

.result-ai{position:absolute;top:56px;left:16px;right:16px;z-index:25;max-height:42vh;overflow:auto;border-radius:16px;background:#fff;box-shadow:0 16px 40px -12px rgba(31,68,77,.18);padding:16px 18px;font-size:13.5px;line-height:1.7;color:#1D2122}
.ai-card h4{margin:0 0 8px;font-size:14px;font-weight:700;color:#337F92}
.ai-card p{margin:0 0 6px}
.ai-card .ai-tag{display:inline-block;margin-right:6px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:#E8F3F4;color:#337F92}
.ai-card .ai-red{background:#FDECEB;color:#D8403A}

/* ── 缓解动作页 ─────────────────────── */
.scene-bar{display:flex;justify-content:center;gap:8px;padding:12px 16px 4px;flex-shrink:0;background:#fff;border-bottom:1px solid #edf0ef}
.scene-pill{font:inherit;border:0;border-radius:99px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:#A2ABAC;transition:background .12s,color .12s}
.scene-pill.on{background:#E8F3F4;color:#337F92}
.scene-pill:active{background:#D8ECEE}

.relief-list{flex:1;min-height:0;overflow:auto;padding:14px 16px 28px;-webkit-overflow-scrolling:touch}
.relief-list::-webkit-scrollbar{display:none}
.relief-list{scrollbar-width:none}

.relief-card{background:#fff;border-radius:18px;padding:16px 18px;margin-bottom:12px;box-shadow:0 4px 16px -8px rgba(31,68,77,.1)}
.relief-card h4{margin:0 0 6px;font-size:15px;font-weight:700;color:#1D2122}
.relief-card .rel-meta{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.relief-card .rel-tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;background:#E8F3F4;color:#337F92}
.relief-card .rel-tag.tight{background:#FDECEB;color:#D8403A}
.relief-card .rel-tag.weak{background:#F0E8F5;color:#7B5BA0}
.relief-card p{margin:0;font-size:13.5px;line-height:1.65;color:#6E7778}

/* ── iOS Sheet ─────────────────────── */
.sheet-mask{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0);transition:background .25s;pointer-events:none}
.sheet-mask.show{background:rgba(0,0,0,.32);pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;border-radius:20px 20px 0 0;background:#fff;box-shadow:0 -10px 40px -15px rgba(0,0,0,.2);transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,.35,1);max-height:85vh;overflow:auto;padding:0 0 env(safe-area-inset-bottom,0)}
.sheet.show{transform:translateY(0)}
.sheet-handle{display:flex;justify-content:center;padding:10px 0 4px}
.sheet-bar{width:36px;height:4px;border-radius:2px;background:#D1D5DB}
.sheet-body{padding:12px 20px 28px}
.sheet-body h3{margin:0 0 6px;font-size:18px;font-weight:700;color:#1D2122}
.sheet-body .sheet-tag{display:inline-block;margin-bottom:12px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#E8F3F4;color:#337F92}
.sheet-body .sheet-tag.tight{background:#FDECEB;color:#D8403A}
.sheet-body .sheet-tag.weak{background:#F0E8F5;color:#7B5BA0}
.sheet-body .sec{margin-bottom:16px}
.sheet-body .sec h5{margin:0 0 4px;font-size:13px;font-weight:700;color:#6E7778;text-transform:uppercase;letter-spacing:.3px}
.sheet-body .sec p{margin:0;font-size:14px;line-height:1.6;color:#1D2122}
.sheet-body .sec .hint{color:#A2ABAC;font-size:12.5px;margin-top:4px}


/* flex 竖向布局 */
.app-wrap{display:flex;flex-direction:column;height:100%}
</style></head><body>

  const score = {};
  for (const p of PATTERNS) {
    let n = 0;
    for (const s of p.senses) if (input.includes(s)) n += s.length;
    if (n > 0) score[p.id] = n;

}
function dedupeConflict(tight, weak, _patternId, treatmentHint = "prefer_weak") {
  const dup = tight.filter((id) => weak.includes(id));
  if (dup.length === 0) return { tight, weak };
  return treatmentHint === "prefer_weak" ? { tight: tight.filter((id) => !dup.includes(id)), weak } : { tight, weak: weak.filter((id) => !dup.includes(id)) };
}
function buildExplanation(patternId, library) {
  const p = PATTERNS.find((x) => x.id === patternId);

  const find = (id) => library.find((m) => m.id === id);
  return {

    tightDetail: p.tight.map(find).filter(Boolean),

    scale = 1;
    var sc = activeScroller();
    if(sc){ sc.scrollLeft = 0; sc.scrollTop = 0; }
    apply();
  }

  /* 指针事件：单击 / 拖动平移 / 双指捏合 */
  stageEl.querySelectorAll('.zoom-scroller').forEach(function(sc){
    sc.addEventListener('pointerdown', function(e){
      pointers[e.pointerId] = {x: e.clientX, y: e.clientY, moved: 0};
      // 注意：这里不能立刻 setPointerCapture——否则 click 会被改投到 scroller，
      // 肌肉 path 永远收不到点选。等真正拖动时再捕获（见 pointermove）。
      if(Object.keys(pointers).length === 2){
        var pts = Object.values(pointers);
        var d0 = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        pinch = { d0: d0, s0: scale,
                  cx: (pts[0].x + pts[1].x) / 2,
                  cy: (pts[0].y + pts[1].y) / 2 };
        try{ sc.setPointerCapture(e.pointerId); }catch(err){}
      }
    });
    sc.addEventListener('pointermove', function(e){
      var prev = pointers[e.pointerId];
      if(!prev) return;
      var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
      pointers[e.pointerId] = {x: e.clientX, y: e.clientY, moved: prev.moved + Math.abs(dx) + Math.abs(dy)};
      var ids = Object.keys(pointers);
      if(ids.length === 2 && pinch){
        var pts = Object.values(pointers);
        var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        var cx = (pts[0].x + pts[1].x) / 2;
        var cy = (pts[0].y + pts[1].y) / 2;
        suppressTap = true;
        setScale(pinch.s0 * d / pinch.d0, cx, cy);
        return;
      }
      // 单指/单鼠标拖动平移（放大后）；位移超过阈值则吞掉随后的 tap
      if(ids.length === 1 && scale > 1){
        if(pointers[e.pointerId].moved > 8){
          suppressTap = true;
          try{ sc.setPointerCapture(e.pointerId); }catch(err){}
        }
        sc.scrollLeft -= dx;
        sc.scrollTop -= dy;
      }
    });
    function up(e){
      delete pointers[e.pointerId];
      if(Object.keys(pointers).length < 2) pinch = null;
      if(Object.keys(pointers).length === 0){
        setTimeout(function(){ suppressTap = false; }, 50);
      }
    }
    sc.addEventListener('pointerup', up);
    sc.addEventListener('pointercancel', up);
  });

  /* 滚轮缩放（触控板捏合 / Ctrl+滚轮） */
  stageEl.querySelectorAll('.zoom-scroller').forEach(function(sc){
    sc.addEventListener('wheel', function(e){
      if(e.ctrlKey || e.metaKey){ e.preventDefault(); setScale(scale * (e.deltaY > 0 ? 0.92 : 1.09), e.clientX, e.clientY); }
    }, {passive: false});
  });

  inBtn.addEventListener('click', function(){ setScale(scale + 0.5); });
  outBtn.addEventListener('click', function(){ setScale(scale - 0.5); });
  resetBtn.addEventListener('click', reset);

  /* 切换正/背面时重置缩放 */
  stageEl.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){ reset(); });
  });

  window.addEventListener('resize', function(){ apply(); });

  apply();
  return {
    get suppressTap(){ return suppressTap; },
    set suppressTap(v){ suppressTap = v; },
    reset: reset
  };
}

/* ── 诊断结果页 ─────────────────────────────────────── */
var pageSelect = document.getElementById('page-select');
var pageResult = document.getElementById('page-result');
var resultTitle = document.getElementById('result-title');
var resultAi = document.getElementById('result-ai');
var aiCard = document.getElementById('ai-card');
var sheetMask = document.getElementById('sheet-mask');
var sheet = document.getElementById('sheet');
var sheetBody = document.getElementById('sheet-body');
var currentResult = null;
var muscleStates = {};

function runDiagnosis(descText){
  var ids = Object.keys(sel);
  if(ids.length === 0) return;
  if(!parseLocal || !MUSCLE_MAP){
    bubble('诊断引擎还没加载好，请稍等一秒再试');
    return;
  }
  var senses = ids.map(function(id){
    var m = MUSCLE_MAP[id];
    return m ? (m.senses && m.senses[0] ? m.senses[0] : m.name + '酸痛') : '';
  }).filter(Boolean).join('，');
  var input = descText ? descText + '；' + senses : senses;
  var res = parseLocal(input, '', undefined);
  currentResult = res;

  muscleStates = {};
  (res.tight || []).forEach(function(r){ muscleStates[r.muscle.id] = 'tight'; });
  (res.weak  || []).forEach(function(r){ muscleStates[r.muscle.id] = 'weak';  });

  // ── 肌肉级兜底：用户点的每一块肌肉都要有结论 ──
  // 模式匹配按感受词触发整组，会漏掉用户实际点的那块。
  // ①反查模式库（这块肌肉在哪个模式的过劳/过弱组）
  // ②都不在就按肌肉自身的 type 倾向（书里的常识分级）
  // 兜底结果标 inferred，图上用虚线描边区分。
  inferredIds = {};
  Object.keys(sel).forEach(function(id){
    if(muscleStates[id]) return;
    var m = MUSCLE_MAP[id];
    if(!m) return;
    var inTight = false, inWeak = false;
    (PATTERNS || []).forEach(function(pt){
      (pt.tight || []).forEach(function(x){ if((typeof x === 'string' ? x : x.id) === id) inTight = true; });
      (pt.weak  || []).forEach(function(x){ if((typeof x === 'string' ? x : x.id) === id) inWeak  = true; });
    });
    var status;
    if(inTight && inWeak) status = m.type === 'weak' ? 'weak' : 'tight';
    else if(inTight)      status = 'tight';
    else if(inWeak)       status = 'weak';
    else                  status = m.type === 'weak' ? 'weak' : 'tight';
    muscleStates[id] = status;
    inferredIds[id] = true;
  });

  cloneResultSvgs();
  applyResultColors();
  buildAiSummary(res);
  pageSelect.style.display = 'none';
  pageResult.style.display = 'flex';
  zoomResult.reset();
}

var resultCloned = false;
function cloneResultSvgs(){
  if(resultCloned) return;
  resultCloned = true;
  [['card-front', 'card-front-result'], ['card-back', 'card-back-result']].forEach(function(pair){
    var src = document.querySelector('#' + pair[0] + ' svg');
    var dst = document.querySelector('#' + pair[1] + ' .zoom-wrap');
    dst.appendChild(src.cloneNode(true));
  });
  document.querySelectorAll('#page-result .m').forEach(function(el){
    el.classList.remove('sel');
    el.addEventListener('click', function(){
      if(zoomResult.suppressTap) return;
      openSheet(el.dataset.id);
    });
  });
}

function applyResultColors(){
  document.querySelectorAll('#page-result .m').forEach(function(el){
    el.classList.remove('tight', 'weak', 'inferred');
    var st = muscleStates[el.dataset.id];
    if(st){
      el.classList.add(st);
      if(inferredIds[el.dataset.id]) el.classList.add('inferred');
    }
  });
}

function buildAiSummary(res){
  var html = '';
  if(res.redFlag) html += '<span class="ai-tag ai-red">⚠ 需要注意</span>';
  // outOfScope 只在"连兜底都给不出任何结果"时才报警；
  // 只要选中的肌肉有结论（含推断），就换成中性说明，不吓人。
  var anyVerdict = Object.keys(muscleStates).length > 0;
  if(res.outOfScope && !anyVerdict) html += '<span class="ai-tag ai-red">超出肌肉范围</span>';
  html += '<h4>诊断摘要</h4>';
  // 计数口径 = muscleStates 里的不同肌肉名称数：
  // 三角肌左右两片 path 共用一个 id，只计一处。
  var tightIds = Object.keys(muscleStates).filter(function(id){ return muscleStates[id] === 'tight'; });
  var weakIds  = Object.keys(muscleStates).filter(function(id){ return muscleStates[id] === 'weak'; });
  var inferredN = Object.keys(inferredIds).length;
  if(res.outOfScope && anyVerdict){
    html += '<p>你的描述没有命中典型的关节受限模式，以下结果是对你选中的肌肉<b>逐块判断</b>得出的。</p>';
  }
  html += '<p><b>判定：</b>' + tightIds.length + ' 处过劳（橙）、' + weakIds.length + ' 处过弱（紫）。同名肌肉左右两侧只计一处。</p>';
  if(inferredN > 0) html += '<p style="color:#A2ABAC;font-size:12.5px">其中 ' + inferredN + ' 处按肌肉常见倾向推断（图上虚线描边标记）。</p>';
  if(res.reason) html += '<p><b>分析：</b>' + res.reason + '</p>';
  if(res.impact) html += '<p><b>影响：</b>' + res.impact + '</p>';
  if(res.treatment) html += '<p><b>方向：</b>' + res.treatment + '</p>';
  if(res.note) html += '<p style="color:#A2ABAC;font-size:12.5px">' + res.note + '</p>';
  if(res.citation) html += '<p style="color:#A2ABAC;font-size:12.5px">依据：' + res.citation + '</p>';
  aiCard.innerHTML = html;
}

resultTitle.addEventListener('click', function(){
  var open = resultAi.style.display !== 'none';
  resultAi.style.display = open ? 'none' : 'block';
  resultTitle.classList.toggle('open', !open);
});

document.getElementById('back-btn').addEventListener('click', function(){
  pageResult.style.display = 'none';
  pageSelect.style.display = 'flex';
  resultAi.style.display = 'none';
  resultTitle.classList.remove('open');
});

function openSheet(id){
  var m = MUSCLE_MAP[id];
  if(!m) return;
  var st = muscleStates[id] || 'neutral';
  var card = buildExplainCard(m, st, currentResult && currentResult.pattern ? currentResult.pattern : null);
  var tagCls = st === 'tight' ? 'tight' : st === 'weak' ? 'weak' : '';
  var tagTxt = st === 'tight' ? '过劳' : st === 'weak' ? '过弱' : '已标记';
  // 「当前问题」把因果链写清：这块肌肉怎么了 → 所以你点的位置为什么不适。
  // 过劳：它自己绷着受累；过弱：它使不上力、别人代偿，两边一起酸。
  var problem = card.problem;
  if(st === 'tight'){
    problem = m.name + '当前处于过劳状态：它长时间缩短、绷着，得不到放松，局部血流变差、代谢产物堆积。' +
      '所以你标记的这个位置会发酸、发胀、发紧，活动到某些角度时会觉得"被卡住"或"扯着"。';
  } else if(st === 'weak'){
    problem = m.name + '当前处于过弱状态：它本该承担的「' + (m.desc || '') + '」这份活使不上力，' +
      '周围的肌肉被迫替它顶班，替班的累了会酸，它自己也因为长期用进废退而更无力。' +
      '所以你标记的这个位置会出现酸软、乏力，甚至隐隐的痛感。';
  }
  var h = '<h3>' + card.name + '</h3>';
  h += '<span class="sheet-tag ' + tagCls + '">' + tagTxt + '</span>';
  if(inferredIds[id]) h += '<span class="sheet-tag" style="background:#F2F4F4;color:#6E7778">推断</span>';
  h += '<div class="sec"><h5>是什么</h5><p>' + card.func + '</p></div>';
  h += '<div class="sec"><h5>当前问题</h5><p>' + problem + '</p>';
  if(card.cause) h += '<p class="hint">成因：' + card.cause + '</p></div>';
  // 建议方向：方向文字 + 动作库里的具体动作名（过劳配放松/拉伸，过弱配激活/强化）
  var adviceHtml = '<p>' + card.advice + '</p>';
  if(st === 'tight' || st === 'weak'){
    var pool = (typeof ACTIONS !== 'undefined' && ACTIONS)
      ? ACTIONS.filter(function(a){ return a.muscles.indexOf(id) !== -1; })
      : [];
    // 优先当前状态的动作；该状态没有就放宽到这块肌肉的所有动作
    var acts = pool.filter(function(a){ return a.forState === st; });
    if(acts.length === 0) acts = pool;
    acts = acts.slice(0, 3);
    if(acts.length > 0){
      adviceHtml += '<p style="margin-top:6px"><b>可以做：</b>' + acts.map(function(a){ return a.name; }).join('、') + '</p>';
    }
  }
  h += '<div class="sec"><h5>建议方向</h5>' + adviceHtml + '</div>';
  if(card.citation) h += '<p class="hint" style="margin-top:4px">依据：' + card.citation + '</p>';
  sheetBody.innerHTML = h;
  sheetMask.style.display = 'block';
  requestAnimationFrame(function(){
    sheetMask.classList.add('show');
    sheet.classList.add('show');
  });
}
function closeSheet(){
  sheetMask.classList.remove('show');
  sheet.classList.remove('show');
  setTimeout(function(){ sheetMask.style.display = 'none'; }, 300);
}
sheetMask.addEventListener('click', closeSheet);

/* ── 缓解动作页 ─────────────────────────────────────── */
var pageRelief = document.getElementById('page-relief');
var reliefList = document.getElementById('relief-list');
var currentScene = 'desk,open';

// 从结果页底部的"查看缓解方式"按钮进来（在结果页 HTML 中已加）
// 由于结果页 HTML 没预留按钮，我们在运行时动态创建它
(function addReliefButton(){
  var btn = document.createElement('footer');
  btn.className = 'relief-bar';
  btn.innerHTML = '<button class="relief-btn" id="relief-btn">查看缓解方式</button>';
  pageResult.appendChild(btn);
})();

// 补一段 CTA 样式（通过 JS 注入，避免再改 CSS 文件）
(function injectCtaCss(){
  var st = document.createElement('style');
  st.textContent = '.relief-bar{padding:10px 16px 14px;background:#fff;border-top:1px solid #edf0ef;flex-shrink:0}' +
    '.relief-btn{width:100%;height:46px;border-radius:23px;border:0;font-size:15px;font-weight:600;color:#fff;background:#4198AC;box-shadow:0 4px 12px -2px rgba(65,152,172,.35);cursor:pointer}' +
    '.relief-btn:active{background:#337F92}';
  document.head.appendChild(st);
})();

document.getElementById('relief-btn') && document.getElementById('relief-btn').addEventListener('click', showRelief);

function showRelief(){
  if(!pickActions) return;
  pageResult.style.display = 'none';
  pageRelief.style.display = 'flex';
  renderRelief();
}

document.getElementById('back-relief-btn').addEventListener('click', function(){
  pageRelief.style.display = 'none';
  pageResult.style.display = 'flex';
});

// 场景切换
pageRelief.querySelectorAll('.scene-pill').forEach(function(b){
  b.addEventListener('click', function(){
    pageRelief.querySelectorAll('.scene-pill').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    currentScene = b.dataset.scene;
    renderRelief();
  });
});

function renderRelief(){
  if(!pickActions || !currentResult) return;
  var tightIds = (currentResult.tight || []).map(function(r){ return r.muscle.id; });
  var weakIds  = (currentResult.weak  || []).map(function(r){ return r.muscle.id; });
  var scenes = currentScene.split(',');
  var picked = [];
  var seen = {};
  scenes.forEach(function(sc){
    // 过劳优先：先搜 tight，再搜 weak
    var t = pickActions({scene: sc, muscleIds: tightIds, state: 'tight', regions: [], avoidIds: []}, 2);
    var w = pickActions({scene: sc, muscleIds: weakIds,  state: 'weak',  regions: [], avoidIds: []}, 1);
    t.concat(w).forEach(function(a){
      if(!seen[a.id] && picked.length < 3){ seen[a.id] = true; picked.push(a); }
    });
  });
  // 不够 3 个就用同场景任意动作补齐
  if(picked.length < 3){
    scenes.forEach(function(sc){
      pickActions({scene: sc, muscleIds: [], state: 'tight', regions: [], avoidIds: []}, 6).forEach(function(a){
        if(!seen[a.id] && picked.length < 3){ seen[a.id] = true; picked.push(a); }
      });
    });
  }
  if(picked.length === 0){
    reliefList.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#A2ABAC;font-size:14px">这个场景暂时没有匹配的动作</div>';
    return;
  }
  var stateMap = {};
  tightIds.forEach(function(id){ stateMap[id] = 'tight'; });
  weakIds.forEach(function(id){ stateMap[id] = 'weak'; });
  reliefList.innerHTML = picked.map(function(a){
    var tagCls = a.forState === 'tight' ? 'tight' : a.forState === 'weak' ? 'weak' : '';
    var tagTxt = a.forState === 'tight' ? '过劳' : a.forState === 'weak' ? '过弱' : '通用';
    return '<div class="relief-card">' +
      '<h4>' + a.name + '</h4>' +
      '<div class="rel-meta"><span class="rel-tag ' + tagCls + '">' + tagTxt + '</span></div>' +
      '<p>' + a.howto + '</p>' +
    '</div>';
  }).join('');
}

(function(){
  var startY = null;
  sheet.addEventListener('pointerdown', function(e){ startY = e.clientY; });
  sheet.addEventListener('pointermove', function(e){
    if(startY === null) return;
    var dy = e.clientY - startY;
    if(dy > 0) sheet.style.transform = 'translateY(' + dy + 'px)';
  });
  sheet.addEventListener('pointerup', function(e){
    if(startY === null) return;
    var dy = e.clientY - startY;
    startY = null;
    sheet.style.transform = '';
    if(dy > 110) closeSheet();
  });
})();
